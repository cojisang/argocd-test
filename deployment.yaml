apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: nginx

spec:
  replicas: 2

  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx

    spec:
      nodeSelector:
        kubernetes.io/hostname: rocky-worker

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: nginx
          image: nginx:devsecops-rollback-test-invalid-20261017

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true

          ports:
            - containerPort: 80

          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf

            - name: nginx-cache
              mountPath: /var/cache/nginx

            - name: nginx-run
              mountPath: /var/run

            - name: nginx-tmp
              mountPath: /tmp

      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config

        - name: nginx-cache
          emptyDir: {}

        - name: nginx-run
          emptyDir: {}

        - name: nginx-tmp
          emptyDir: {}
