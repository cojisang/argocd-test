apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  namespace: wordpress

spec:
  replicas: 1

  selector:
    matchLabels:
      app: wordpress

  template:
    metadata:
      labels:
        app: wordpress

    spec:
      nodeSelector:
        kubernetes.io/hostname: rocky-worker

      containers:
        - name: wordpress
          image: wordpress:latest

          ports:
            - containerPort: 80

          env:
            - name: WORDPRESS_DB_HOST
              value: "mariadb:3306"

            - name: WORDPRESS_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: database

            - name: WORDPRESS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: username

            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: password

          volumeMounts:
            - name: wordpress-storage
              mountPath: /var/www/html

      volumes:
        - name: wordpress-storage
          persistentVolumeClaim:
            claimName: wordpress-pvc
